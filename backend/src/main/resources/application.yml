# Base configuration. Environment-specific values come from environment
# variables (see ../.env.example); credentials have no defaults on purpose.
spring:
  application:
    name: cdss-backend
  autoconfigure:
    # No default in-memory user (whose generated password would be logged);
    # accounts live in the users table (V7).
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:mysql://${CDSS_DB_HOST:localhost}:${CDSS_DB_PORT:3306}/${CDSS_DB_NAME:cdss}
    username: ${CDSS_DB_USERNAME}
    password: ${CDSS_DB_PASSWORD}
    hikari:
      # Fail health checks quickly instead of waiting the 30s default.
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway; Hibernate only verifies it matches.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: never
  mvc:
    problemdetails:
      enabled: true

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        # JavaScript cannot read the session cookie, and browsers do not send
        # it on requests started by other sites. "secure" stays off because
        # local development uses plain HTTP; turn it on behind HTTPS.
        http-only: true
        same-site: strict
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

cdss:
  decision:
    # Observations older than these limits are not used by rules; the rules
    # report the data as missing instead of relying on stale values.
    vital-signs-max-age: 24h
    lab-results-max-age: 72h
  follow-ups:
    # A scheduled follow-up due within this time is listed as "upcoming"; one
    # whose time has passed is "overdue". Calculated when the list is read.
    upcoming-window: 7d
