# Local development profile. Loads variables from the repository-root .env
# (the backend runs with backend/ as its working directory). Real environment
# variables still take precedence over values in the file.
spring:
  config:
    import: optional:file:../.env[.properties]

# Passwords for the demo users "admin" and "clinician", created at startup if
# they do not exist yet (see DemoUserInitializer). Set them in .env; if a value
# is empty that user is not created.
cdss:
  demo-users:
    admin-password: ${CDSS_DEMO_ADMIN_PASSWORD:}
    clinician-password: ${CDSS_DEMO_CLINICIAN_PASSWORD:}

# Local development uses plain HTTP, so only this computer may connect:
# passwords and session cookies never travel over the network. Without this
# the backend would accept connections on every network interface.
server:
  address: 127.0.0.1
